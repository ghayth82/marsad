name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: marsad_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - name: الاختبارات على SQLite
        run: cd backend && python -m pytest -q
      - name: الاختبارات على PostgreSQL
        run: cd backend && python -m pytest -q
        env: { MARSAD_TEST_DATABASE_URL: "postgresql+psycopg://postgres:test@localhost:5432/marsad_test" }
      - name: تجهيز المجلدات على جهاز نظيف
        run: ./scripts/start.sh --prepare-only && test -d data/archive && test -d data/backups/db
      - name: صياغة docker-compose
        run: cp .env.example .env && sed -i 's/^\(POSTGRES_PASSWORD\|MEILI_MASTER_KEY\)=$/\1=x/' .env && docker compose --env-file .env config -q
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: "الواجهة — فحص الأنواع والاختبارات والبناء"
        run: cd frontend && npm ci && npx vitest run && npm run build
      - run: pip install -e "backend[dev]" playwright && python -m playwright install --with-deps chromium
      - name: فحص من طرف إلى طرف في المتصفح
        run: |
          mkdir -p /tmp/e2e
          (cd backend && MARSAD_HOME=/tmp/e2e MARSAD_DATABASE_URL=sqlite:////tmp/e2e/e2e.db python -m uvicorn marsad.main:app --port 8000 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          MARSAD_E2E_SHOTS=e2e/screenshots python e2e/test_foundation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: e2e/screenshots }
  windows-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: start.ps1 -PrepareOnly على ويندوز
        shell: powershell
        run: |
          .\scripts\start.ps1 -PrepareOnly
          if (-not (Test-Path data\archive)) { exit 1 }
          New-Item -ItemType Directory -Force config | Out-Null
          '{"data_dir":"./data","backup_dir":"","pending":{"data_dir":"C:\\MarsadTest\\Data","backup_dir":null,"move_data":true,"requested_by":"ci"},"last_error":null,"history":[]}' | Set-Content -Encoding ascii config\storage.json
          'x' | Set-Content data\archive\probe.txt
          New-Item -ItemType Directory -Force C:\MarsadTest | Out-Null
          .\scripts\start.ps1 -PrepareOnly
          if (-not (Test-Path C:\MarsadTest\Data\archive\probe.txt)) { exit 1 }
          if (-not (Test-Path data\archive\probe.txt)) { exit 1 }
          $c = Get-Content -Raw config\storage.json | ConvertFrom-Json
          if ($c.data_dir -ne 'C:\MarsadTest\Data' -or $c.pending) { exit 1 }
          # قرص غير موصول: يُرفض ويبقى المكان الحالي
          '{"data_dir":"C:\\MarsadTest\\Data","backup_dir":"","pending":{"data_dir":"Q:\\Nope\\Data","backup_dir":null,"move_data":true,"requested_by":"ci"},"last_error":null,"history":[]}' | Set-Content -Encoding ascii config\storage.json
          .\scripts\start.ps1 -PrepareOnly
          $c = Get-Content -Raw config\storage.json | ConvertFrom-Json
          if ($c.data_dir -ne 'C:\MarsadTest\Data' -or -not $c.last_error) { exit 1 }
          if (-not (Test-Path config\host-info.json)) { exit 1 }
