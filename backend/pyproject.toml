[project]
name = "marsad"
version = "0.0.1"
description = "مرصد التحقق — أداة رصد وتحقق للصحفيين"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "alembic>=1.13",
  "procrastinate>=3.12,<4",
  "httpx>=0.27",
  "cryptography>=42",
  "trafilatura>=2.0",
  "feedparser>=6.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "numpy>=1.26",
  "c2pa-python>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
