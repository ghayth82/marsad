<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مرصد التحقق</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#EEF0F2;color:#18202A;font-family:"Segoe UI",Tahoma,sans-serif}
  .box{text-align:center;max-width:460px;padding:24px}
  .logo{width:72px;height:72px;border-radius:18px;background:#0F766E;margin:0 auto 18px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#5B6673;line-height:1.8;margin:0}
  .err{color:#B42318;margin-top:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <div class="logo" aria-hidden="true"></div>
  <h1>مرصد التحقق</h1>
  <p id="status">جارٍ تشغيل البرنامج…</p>
  <p class="err" id="error"></p>
</div>
<script>
  // تتلقى هذه الصفحة حالة التشغيل من البرنامج، ثم ينتقل إلى الواجهة حين تجهز
  window.marsadStatus = (t) => { document.getElementById("status").textContent = t; };
  window.marsadError = (t) => { document.getElementById("error").textContent = t; };
</script>
</body>
</html>
