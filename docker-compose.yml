# مرصد التحقق — طبقة البنية التحتية.
# لا تُشغَّل مباشرة؛ استخدم scripts/start.ps1 (ويندوز) أو scripts/start.sh (لينكس)
# لأنهما يحددان مكان البيانات وينشئان المجلدات قبل التشغيل.
#
# أين تذهب البيانات:
#   ${MARSAD_DATA_ROOT}/archive  <- MinIO (الصفحات المؤرشفة، الصور، الفيديو، الوثائق)
#   ${MARSAD_BACKUP_ROOT}        <- نسخ قاعدة البيانات اليومية
#   قاعدة البيانات والبحث والطابور داخل مجلدات Docker (volumes) لأسباب أداء
#   وصلاحيات على ويندوز، وتُحفظ نسخها في مجلد النسخ الاحتياطي، وتُستعاد
#   تلقائيًا عند التشغيل على جهاز جديد.

name: marsad

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: marsad
      POSTGRES_DB: marsad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?شغّل سكربت التشغيل لتوليد كلمة المرور}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${MARSAD_BACKUP_ROOT:-./data/backups}:/backups
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marsad -d marsad"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?}
      MEILI_NO_ANALYTICS: "true"
    volumes: [meilidata:/meili_data]
    ports: ["127.0.0.1:7700:7700"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marsad
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - ${MARSAD_DATA_ROOT:-./data}/archive:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  # الخادم والعمّال والواجهة تُضاف في بند «الأساس»؛ كلها ترى جذر البيانات على /data
  # وتستدعي marsad.core.paths.ensure_storage() عند البدء:
  #   volumes: ["${MARSAD_DATA_ROOT}:/data", "${MARSAD_BACKUP_ROOT}:/backups"]
  #   environment: {MARSAD_DATA_DIR: /data, MARSAD_BACKUP_DIR: /backups}

volumes:
  pgdata:
  redisdata:
  meilidata:
